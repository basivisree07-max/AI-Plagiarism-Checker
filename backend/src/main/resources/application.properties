spring.application.name=plagiarism-backend

server.port=8080

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/plagiarism_checker}

spring.data.mongodb.database=plagiarism_checker

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
